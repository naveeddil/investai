name: Deploy staging via FTPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed_consultancy_content:
        description: Run ConsultancyContentSeeder (resets the consultancy pages, overwriting CMS edits to them)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      STAGING_URL: ${{ vars.STAGING_URL || 'https://staging.investai.business' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, pdo_mysql, pdo_sqlite, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and build assets
        run: |
          composer install --no-interaction --prefer-dist
          npm ci --ignore-scripts
          npm run build -- --configLoader native

      - name: Run the tests
        run: |
          cp .env.example .env
          php artisan key:generate --ansi --no-interaction
          php artisan test --compact
          rm -f .env

      - name: Keep production dependencies only
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare upload files
        run: |
          mkdir -p artifacts/ftps-release
          rsync -a --relative \
            --exclude='.gitignore' \
            --exclude='bootstrap/cache/***' \
            --exclude='database/*.sqlite*' \
            --exclude='public/storage' \
            --exclude='public/hot' \
            app bootstrap config database public resources routes vendor \
            artisan composer.json composer.lock artifacts/ftps-release/
          test -f artifacts/ftps-release/public/build/manifest.json
          test -f artifacts/ftps-release/vendor/autoload.php
          test ! -e artifacts/ftps-release/.env
          test ! -e artifacts/ftps-release/storage

      # Uploading ~17,000 files one by one over FTPS takes longer than the job
      # timeout, so the release goes up as one archive that a one-time hook
      # extracts on the server.
      - name: Package the release and deployment hook
        run: |
          DEPLOY_ID="deploy-$(openssl rand -hex 16)"
          DEPLOY_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$DEPLOY_TOKEN"
          TOKEN_SHA256="$(printf '%s' "$DEPLOY_TOKEN" | sha256sum | cut -d' ' -f1)"
          (cd artifacts/ftps-release && zip -qr -X "../$DEPLOY_ID.zip" .)
          sed -e "s/__DEPLOY_ID__/$DEPLOY_ID/" -e "s/__DEPLOY_TOKEN_SHA256__/$TOKEN_SHA256/" \
            scripts/deploy-hook.php > "artifacts/$DEPLOY_ID.php"
          php -l "artifacts/$DEPLOY_ID.php"
          ls -lh "artifacts/$DEPLOY_ID.zip"
          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
          echo "DEPLOY_TOKEN=$DEPLOY_TOKEN" >> "$GITHUB_ENV"

      - name: Install FTPS client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp
          cat > ~/.lftprc <<'LFTPRC'
          set cmd:fail-exit yes
          set ftp:passive-mode yes
          set ftp:sync-mode yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:ssl-protect-list yes
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          set net:timeout 30
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set xfer:timeout 120
          set xfer:use-temp-file yes
          LFTPRC

      - name: Upload the release archive and hook
        env:
          FTP_HOST: ${{ secrets.STAGING_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          : "${FTP_HOST:?Add the STAGING_FTP_HOST repository secret}"
          : "${FTP_USERNAME:?Add the STAGING_FTP_USERNAME repository secret}"
          : "${LFTP_PASSWORD:?Add the STAGING_FTP_PASSWORD repository secret}"
          lftp --env-password --user "$FTP_USERNAME" -p 21 "ftp://$FTP_HOST" <<LFTP
          cd /
          cls -d app bootstrap public storage vendor
          put -O / artifacts/$DEPLOY_ID.zip
          put -O /public artifacts/$DEPLOY_ID.php
          bye
          LFTP

      - name: Install the release and run Laravel commands
        env:
          SEED: ${{ inputs.seed_consultancy_content && '1' || '0' }}
        # The server stops requests after ~30 seconds, so the hook works in
        # short steps and answers CONTINUE until it has finished.
        run: |
          for attempt in $(seq 1 100); do
            status=0
            curl --silent --show-error --fail-with-body --max-time 60 \
              -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" --data "seed=$SEED" \
              -o hook-output.txt "$STAGING_URL/$DEPLOY_ID.php" || status=$?
            cat hook-output.txt
            test "$status" -eq 0
            grep -qx 'DEPLOYMENT COMPLETE' hook-output.txt && exit 0
            grep -qx 'CONTINUE' hook-output.txt
          done
          echo "The deployment hook did not finish after $attempt calls"
          exit 1

      - name: Check the staging website responds
        run: curl --silent --show-error --fail --max-time 60 -o /dev/null -w 'HTTP %{http_code}\n' "$STAGING_URL/"

      - name: Remove leftover deployment files
        if: always() && env.DEPLOY_ID != ''
        env:
          FTP_HOST: ${{ secrets.STAGING_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          lftp --env-password --user "$FTP_USERNAME" -p 21 "ftp://$FTP_HOST" <<LFTP
          set cmd:fail-exit no
          rm -f /$DEPLOY_ID.zip
          rm -f /.deploy-state-$DEPLOY_ID.json
          rm -f /public/$DEPLOY_ID.php
          bye
          LFTP

      - name: Report deployment
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Uploaded the staging release as one archive over explicit FTPS (port 21) and installed it with a one-time hook.

          app, config, database, resources, routes and vendor were replaced; bootstrap, public and root files were overwritten.
          Server .env, storage, the application-root .htaccess and public/.user.ini were preserved.
          `migrate --force` and `optimize:clear` ran on the server.
          SUMMARY
